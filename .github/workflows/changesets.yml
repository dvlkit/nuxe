name: Release

on:
  push:
    branches:
      - develop

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Check for pending changesets
        id: check
        run: |
          PENDING=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l | tr -d ' ')
          echo "pending=$([ "$PENDING" -gt 0 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Version packages
        if: steps.check.outputs.pending == 'true'
        run: pnpm changeset version

      - name: Get changed packages
        if: steps.check.outputs.pending == 'true'
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD -- packages/*/package.json | sed 's|packages/\(.*\)/package.json|\1|' | tr '\n' ' ')
          echo "names=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Commit version bumps
        if: steps.check.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: release packages" || echo "No changes to commit"
          git push

      - name: Build all packages
        if: steps.check.outputs.pending == 'true'
        run: pnpm -r --filter '!playground' build

      - name: Publish to npm
        if: steps.check.outputs.pending == 'true'
        run: pnpm changeset publish

      - name: Create tags and GitHub Releases
        if: steps.check.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED="${{ steps.changed.outputs.names }}"
          if [ -z "$CHANGED" ]; then
            echo "No packages changed, nothing to release"
            exit 0
          fi
          for PKG in $CHANGED; do
            PKG_DIR="packages/$PKG"
            NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
            VERSION=$(node -p "require('./${PKG_DIR}/package.json').version")
            TAG="${NAME}@${VERSION}"

            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" -m "Release ${TAG}"
              git push origin "$TAG"
            else
              echo "Tag $TAG already exists, skipping"
            fi

            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --title "${NAME} v${VERSION}" \
                --generate-notes \
                --target "$(git rev-parse HEAD)"
            else
              echo "Release $TAG already exists, skipping"
            fi
          done
